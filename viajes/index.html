<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ruta · Agente de viajes</title>
  <meta name="description" content="Agente de planificación de viajes en carro (iCAR 03T eléctrica) o en avión: rutas, peajes, carga, sitios turísticos y hospedajes.">
  <meta name="theme-color" content="#0e7c66">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧭%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <button class="brand" id="btn-inicio" type="button">🧭 <b>Ruta</b> <span>agente de viajes</span></button>
    <nav>
      <button type="button" class="ghost" id="btn-historial">🗂️ Mis viajes</button>
      <button type="button" class="ghost" id="btn-ajustes">⚙️ Ajustes</button>
    </nav>
  </header>
  <main id="app"></main>

  <dialog id="dlg-ajustes">
    <form method="dialog" id="form-ajustes">
      <h2>⚙️ Ajustes</h2>
      <fieldset>
        <legend>Agente (Claude)</legend>
        <label>Clave de API de Anthropic
          <input type="password" name="apiKey" placeholder="sk-ant-…" autocomplete="off">
        </label>
        <p class="hint">Se guarda solo en este navegador y se envía directo a api.anthropic.com. Consíguela en <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>.</p>
        <div class="row2">
          <label>Modelo
            <select name="model">
              <option value="claude-opus-5-5">Claude Opus 5.5 (mejor calidad)</option>
              <option value="claude-sonnet-5-5">Claude Sonnet 5.5 (más económico)</option>
              <option value="claude-haiku-5-5">Claude Haiku 5.5 (rápido y barato)</option>
            </select>
          </label>
          <label>Profundidad de investigación
            <select name="effort">
              <option value="low">Rápida</option>
              <option value="medium">Normal</option>
              <option value="high">A fondo</option>
            </select>
          </label>
        </div>
      </fieldset>
      <fieldset>
        <legend>🔋 Mi iCAR 03T</legend>
        <div class="row2">
          <label>Batería útil (kWh)<input type="number" step="any" name="bateriaKwh"></label>
          <label>Consumo en plano (kWh/100 km)<input type="number" step="any" name="consumoBase"></label>
          <label>Peso con carga (kg)<input type="number" step="any" name="masaKg"></label>
          <label>Reserva mínima (%)<input type="number" step="any" name="reservaPct"></label>
          <label>Cargar en DC hasta (%)<input type="number" step="any" name="cargaDcMaxPct"></label>
          <label>Potencia DC real (kW)<input type="number" step="any" name="potenciaDcKw"></label>
        </div>
        <button type="button" class="link" id="btn-reset-energia">Restaurar valores de fábrica</button>
      </fieldset>
      <menu>
        <button value="cancel" class="ghost" type="submit" formnovalidate>Cancelar</button>
        <button value="ok" class="primary" type="submit">Guardar</button>
      </menu>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
